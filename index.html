<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Password Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* gray-50 */
        }
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #0d9488; /* teal-600 */
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #0d9488;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #e5e7eb; /* gray-200 */
            transition: all 0.3s;
        }
        .toggle-label {
            width: 3rem;
            height: 1.5rem;
            background-color: #e5e7eb;
            border-radius: 9999px;
            transition: all 0.3s;
        }
        .toggle-dot {
            top: 0.125rem;
            left: 0.125rem;
            width: 1.25rem;
            height: 1.25rem;
            background-color: white;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle-checkbox:checked ~ .toggle-dot {
            transform: translateX(100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100">
        
        <div class="p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Minimal Password Generator</h1>
                <p class="text-sm text-gray-500 mt-2">Hard to guess. Easy to remember.</p>
            </div>

            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-700 mb-2">Your password</label>
                <div class="relative bg-gray-50 border border-gray-200 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 transition-all hover:border-teal-500 focus-within:border-teal-500">
                    <div id="passwordDisplay" class="text-xl sm:text-2xl font-bold text-gray-800 break-all text-center sm:text-left w-full">
                        Neon-Guitar-River
                    </div>
                    <button id="copyBtn" class="flex-shrink-0 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-teal-600 font-medium py-2 px-4 rounded-xl shadow-sm transition-colors text-sm w-full sm:w-auto flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="copyText">Copy</span>
                    </button>
                </div>
            </div>

            <div class="space-y-6">
                <!-- Word Count Setting -->
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-base font-medium text-gray-900 block">Words</span>
                        <span class="text-xs text-gray-500">Length of the phrase</span>
                    </div>
                    <div class="flex items-center gap-3 bg-gray-50 p-1 rounded-xl border border-gray-200">
                        <button id="decreaseWords" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white shadow-sm border border-gray-200 text-gray-600 hover:bg-gray-100 hover:text-teal-600 transition-colors">-</button>
                        <span id="wordCountDisplay" class="font-semibold text-lg w-4 text-center">3</span>
                        <button id="increaseWords" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white shadow-sm border border-gray-200 text-gray-600 hover:bg-gray-100 hover:text-teal-600 transition-colors">+</button>
                    </div>
                </div>

                <hr class="border-gray-100">

                <!-- Number Toggle -->
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-base font-medium text-gray-900 block">Number</span>
                        <span class="text-xs text-gray-500">Append a random digit</span>
                    </div>
                    <div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggleNumber" id="toggleNumber" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0"/>
                        <label for="toggleNumber" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                        <div class="toggle-dot absolute block w-5 h-5 rounded-full bg-white shadow inset-y-0 left-0 mt-0.5 ml-0.5 pointer-events-none"></div>
                    </div>
                </div>

                <hr class="border-gray-100">

                <!-- Symbol Toggle -->
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-base font-medium text-gray-900 block">Symbol</span>
                        <span class="text-xs text-gray-500">Append a special character</span>
                    </div>
                    <div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggleSymbol" id="toggleSymbol" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer opacity-0"/>
                        <label for="toggleSymbol" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                        <div class="toggle-dot absolute block w-5 h-5 rounded-full bg-white shadow inset-y-0 left-0 mt-0.5 ml-0.5 pointer-events-none"></div>
                    </div>
                </div>
            </div>

            <div class="mt-10">
                <button id="generateBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-4 focus:ring-teal-500 focus:ring-opacity-50 text-lg flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Generate Password
                </button>
            </div>
        </div>
    </div>

    <script>
        // A curated list of easy-to-read, visually distinct, and pleasant words
        const wordList = [
            "Apple", "River", "Guitar", "Neon", "Sunset", "Mountain", "Ocean", "Tiger", 
            "Window", "Cloud", "Breeze", "Forest", "Coffee", "Rocket", "Planet", "Crystal",
            "Mango", "Desert", "Velvet", "Marble", "Castle", "Silver", "Copper", "Eagle",
            "Dragon", "Spirit", "Shadow", "Lantern", "Bridge", "Garden", "Pocket", "Puzzle",
            "Ribbon", "Thunder", "Winter", "Summer", "Autumn", "Spring", "Cactus", "Diamond",
            "Feather", "Galaxy", "Harbor", "Island", "Jungle", "Leopard", "Meadow", "Nebula",
            "Orchid", "Pirate", "Quartz", "Robot", "Safari", "Temple", "Unicorn", "Volcano",
            "Wizard", "Yellow", "Zephyr", "Anchor", "Beacon", "Canyon", "Dolphin", "Engine"
        ];

        const symbols = ["!", "@", "#", "$", "%", "^", "&", "*", "?", "~"];

        // State variables
        let currentWordCount = 3;
        
        // DOM Elements
        const passwordDisplay = document.getElementById('passwordDisplay');
        const copyBtn = document.getElementById('copyBtn');
        const copyText = document.getElementById('copyText');
        const decreaseWordsBtn = document.getElementById('decreaseWords');
        const increaseWordsBtn = document.getElementById('increaseWords');
        const wordCountDisplay = document.getElementById('wordCountDisplay');
        const toggleNumber = document.getElementById('toggleNumber');
        const toggleSymbol = document.getElementById('toggleSymbol');
        const generateBtn = document.getElementById('generateBtn');

        function generatePassword() {
            let passwordParts = [];
            
            // Pick random words
            for (let i = 0; i < currentWordCount; i++) {
                const randomIndex = Math.floor(Math.random() * wordList.length);
                const word = wordList[randomIndex];
                // Ensure capitalization format: First letter uppercase, rest lowercase
                const formattedWord = word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                passwordParts.push(formattedWord);
            }

            let finalPassword = passwordParts.join('-');

            // Append Number if checked
            if (toggleNumber.checked) {
                const randomNumber = Math.floor(Math.random() * 10); // 0-9
                finalPassword += randomNumber;
            }

            // Append Symbol if checked
            if (toggleSymbol.checked) {
                const randomSymbolIndex = Math.floor(Math.random() * symbols.length);
                finalPassword += symbols[randomSymbolIndex];
            }

            passwordDisplay.textContent = finalPassword;
            
            // Reset copy button state if it was copied
            resetCopyButton();
        }

        function updateWordCount(newCount) {
            if (newCount >= 2 && newCount <= 8) {
                currentWordCount = newCount;
                wordCountDisplay.textContent = currentWordCount;
                generatePassword(); // Regenerate immediately on change
            }
        }

        function resetCopyButton() {
            copyText.textContent = "Copy";
            copyBtn.classList.remove("text-teal-600", "border-teal-300", "bg-teal-50");
            copyBtn.classList.add("text-gray-700", "bg-white");
        }

        // Event Listeners
        decreaseWordsBtn.addEventListener('click', () => updateWordCount(currentWordCount - 1));
        increaseWordsBtn.addEventListener('click', () => updateWordCount(currentWordCount + 1));
        
        toggleNumber.addEventListener('change', generatePassword);
        toggleSymbol.addEventListener('change', generatePassword);
        
        generateBtn.addEventListener('click', generatePassword);

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "absolute";
            textArea.style.left = "-999999px";
            document.body.prepend(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showCopiedState();
            } catch (error) {
                console.error("Fallback copy failed", error);
                copyText.textContent = "Failed";
                setTimeout(resetCopyButton, 2000);
            } finally {
                textArea.remove();
            }
        }

        copyBtn.addEventListener('click', () => {
            const textToCopy = passwordDisplay.textContent;
            
            // Modern clipboard API with fallback
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy)
                    .then(showCopiedState)
                    .catch(err => {
                        console.warn("Clipboard API blocked or failed, using fallback.", err);
                        fallbackCopyTextToClipboard(textToCopy);
                    });
            } else {
                // Fallback for older browsers or non-secure contexts
                fallbackCopyTextToClipboard(textToCopy);
            }
        });

        function showCopiedState() {
            copyText.textContent = "Copied!";
            copyBtn.classList.add("text-teal-600", "border-teal-300", "bg-teal-50");
            copyBtn.classList.remove("text-gray-700", "bg-white");
            
            setTimeout(() => {
                resetCopyButton();
            }, 2000);
        }

        // Initialize with a generated password on load
        window.onload = () => {
            generatePassword();
        };

    </script>
</body>
</html>
